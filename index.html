<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0b09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Roguelike Brogue — RGL1</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0b09;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #d4a843;
        background: #0d0b09;
        z-index: 10;
        transition: opacity 0.4s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        font-size: 18px;
        letter-spacing: 2px;
        font-weight: 600;
      }
      #boot p {
        font-size: 12px;
        color: #6b5f4a;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot">
      <h1>RGL1</h1>
      <p>memuat dungeon…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
